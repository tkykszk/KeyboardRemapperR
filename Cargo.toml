[package]
name = "keyboard-remapper-r"
version = "1.0.0"
edition = "2021"
description = "Lightweight device-specific keyboard remapper for Windows"
license = "MIT"

[[bin]]
name = "keyboard-remapper-r"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
winapi = { version = "0.3", features = ["winuser", "winnt"] }
clap = { version = "4.4", features = ["derive"] }
windows-service = "0.7"
notify = "6.1"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
