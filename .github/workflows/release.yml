name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build Release
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Run unit tests
        run: cargo test --release
      
      - name: Build release binary
        run: cargo build --release
      
      - name: Check binary exists
        run: |
          if (Test-Path "target\release\keyboard-remapper-r.exe") {
            Write-Host "✓ Binary exists"
            Get-Item "target\release\keyboard-remapper-r.exe" | Format-List
          } else {
            Write-Host "✗ Binary not found"
            exit 1
          }
        shell: pwsh
      
      - name: Create release package
        run: |
          $version = "${{ github.ref_name }}"
          $packageName = "KeyboardRemapperR-$version-windows-x64"
          
          # Create package directory
          New-Item -ItemType Directory -Path $packageName -Force
          
          # Copy binary
          Copy-Item "target\release\keyboard-remapper-r.exe" "$packageName\"
          
          # Copy test scripts
          Copy-Item "tests\e2e_test_simple.ps1" "$packageName\"
          Copy-Item "tests\e2e_test_full.ps1" "$packageName\"
          
          # Copy README
          Copy-Item "README.md" "$packageName\"
          
          # Create sample config
          @"
          {
            "devices": {
              "04FE:0021": {
                "name": "HHKB Professional",
                "mappings": [
                  {
                    "from": "CapsLock",
                    "to": "LCtrl"
                  }
                ]
              }
            }
          }
          "@ | Out-File -FilePath "$packageName\config.sample.json" -Encoding utf8
          
          # Create ZIP
          Compress-Archive -Path $packageName -DestinationPath "$packageName.zip"
          
          Write-Host "✓ Release package created: $packageName.zip"
          Get-Item "$packageName.zip" | Format-List
        shell: pwsh
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            KeyboardRemapperR-${{ github.ref_name }}-windows-x64.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
