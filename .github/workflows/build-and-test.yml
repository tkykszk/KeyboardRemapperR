name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-windows:
    name: Windows E2E Tests
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-index-
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-target-
      
      - name: Run unit tests
        run: cargo test --verbose
      
      - name: Build release binary
        run: cargo build --release --verbose
      
      - name: Check binary exists
        run: |
          Get-Item target\release\keyboard-remapper-r.exe | Select-Object -Property FullName, @{Name='Size(KB)';Expression={[math]::Round($_.Length/1KB,2)}}
        shell: pwsh
      
      - name: Run E2E tests (Simple)
        run: |
          Write-Host "Running simple E2E tests..." -ForegroundColor Cyan
          powershell -ExecutionPolicy Bypass -File tests\e2e_test_simple.ps1
        shell: pwsh
      
      # Temporarily disabled - full E2E tests need more work
      # - name: Run E2E tests (Full)
      #   run: |
      #     Write-Host "Running full E2E tests..." -ForegroundColor Cyan
      #     powershell -ExecutionPolicy Bypass -File tests\e2e_test_full.ps1
      #   shell: pwsh
      
      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-remapper-r-windows
          path: target/release/keyboard-remapper-r.exe
          retention-days: 7
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test_*.json
            *.log
          retention-days: 7

  test-linux:
    name: Linux Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-index-
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-target-
      
      - name: Run unit tests
        run: cargo test --verbose
      
      - name: Build release binary
        run: cargo build --release --verbose
      
      - name: Check binary size
        run: |
          ls -lh target/release/keyboard-remapper-r
          du -h target/release/keyboard-remapper-r

  build-release:
    name: Build Release
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-windows, test-linux]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      
      - name: Build release binary
        run: cargo build --release --verbose
      
      - name: Create release archive
        run: |
          $version = "${{ github.ref_name }}"
          $archiveName = "KeyboardRemapperR-$version-win-x64.zip"
          Compress-Archive -Path target\release\keyboard-remapper-r.exe -DestinationPath $archiveName
          Write-Host "Created archive: $archiveName"
        shell: pwsh
      
      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-archive
          path: KeyboardRemapperR-*.zip
          retention-days: 30
